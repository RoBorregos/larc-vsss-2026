services:
  isaac-sim:
    image: nvcr.io/nvidia/isaac-sim:4.5.0
    container_name: isaac_vsss_container
    stdin_open: true
    tty: true
    network_mode: host
    entrypoint: bash
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - OMNI_KIT_ALLOW_ROOT=1
      - DISPLAY=${DISPLAY}            # Pasa la variable de pantalla
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix # El socket de video
      - ${XAUTHORITY}:/root/.Xauthority # Los permisos de X11      
      - ./cache/kit:/root/.cache/ov/kit:rw
      - ./cache/ov:/root/.cache/nvidia/ov:rw
      - ./data:/root/.local/share/ov/data:rw
      - .:/isaac-sim/project:rw
